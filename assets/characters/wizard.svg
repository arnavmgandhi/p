<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges" width="256" height="320">
  <!-- Wizard / developer-mage character holding a glowing wand -->

  <!-- Shadow -->
  <ellipse cx="32" cy="77" rx="12" ry="3" fill="rgba(0,0,0,0.15)"/>

  <!-- Robe / body -->
  <rect x="18" y="36" width="28" height="30" fill="#6b4fa0"/>
  <!-- Robe highlights -->
  <rect x="20" y="38" width="4"  height="26" fill="#7d62b2"/>
  <rect x="40" y="38" width="4"  height="26" fill="#5a3f8a"/>
  <!-- Robe bottom hem -->
  <rect x="16" y="62" width="32" height="4"  fill="#5a3f8a"/>
  <rect x="14" y="64" width="36" height="4"  fill="#4e3478"/>

  <!-- Belt -->
  <rect x="18" y="52" width="28" height="3"  fill="#c9a030"/>
  <rect x="29" y="51" width="6"  height="5"  fill="#e8b840"/>

  <!-- Neck -->
  <rect x="28" y="30" width="8"  height="8"  fill="#e8c99a"/>

  <!-- Head -->
  <rect x="20" y="12" width="24" height="22" fill="#e8c99a"/>
  <rect x="22" y="10" width="20" height="4"  fill="#e8c99a"/>
  <rect x="24" y="8"  width="16" height="4"  fill="#e8c99a"/>

  <!-- Pointy wizard hat -->
  <rect x="22" y="4"  width="20" height="10" fill="#4e3478"/>
  <rect x="24" y="2"  width="16" height="4"  fill="#4e3478"/>
  <rect x="26" y="0"  width="12" height="4"  fill="#4e3478"/>
  <rect x="28" y="-2" width="8"  height="4"  fill="#4e3478"/><!-- tip clipped by viewBox -->
  <!-- Hat brim -->
  <rect x="16" y="12" width="32" height="4"  fill="#6b4fa0"/>
  <!-- Hat star -->
  <rect x="29" y="5"  width="2"  height="6"  fill="#e8b840"/>
  <rect x="27" y="7"  width="6"  height="2"  fill="#e8b840"/>

  <!-- Eyes (wide, excited) -->
  <rect x="24" y="20" width="5"  height="5"  fill="#2a1a0a"/>
  <rect x="35" y="20" width="5"  height="5"  fill="#2a1a0a"/>
  <!-- Iris glow -->
  <rect x="25" y="21" width="3"  height="3"  fill="#7b50d0"/>
  <rect x="36" y="21" width="3"  height="3"  fill="#7b50d0"/>
  <!-- Shine -->
  <rect x="25" y="20" width="1"  height="1"  fill="#fff"/>
  <rect x="36" y="20" width="1"  height="1"  fill="#fff"/>

  <!-- Eyebrows -->
  <rect x="23" y="18" width="7"  height="2"  fill="#5c3d1e"/>
  <rect x="34" y="18" width="7"  height="2"  fill="#5c3d1e"/>

  <!-- Excited grin -->
  <rect x="26" y="29" width="12" height="2"  fill="#c07040"/>
  <rect x="25" y="28" width="2"  height="2"  fill="#c07040"/>
  <rect x="37" y="28" width="2"  height="2"  fill="#c07040"/>
  <!-- Teeth -->
  <rect x="27" y="29" width="2"  height="2"  fill="#f5f0e8"/>
  <rect x="29" y="29" width="2"  height="2"  fill="#d4c9b0"/>
  <rect x="31" y="29" width="2"  height="2"  fill="#f5f0e8"/>
  <rect x="33" y="29" width="2"  height="2"  fill="#d4c9b0"/>
  <rect x="35" y="29" width="2"  height="2"  fill="#f5f0e8"/>

  <!-- Left arm (raised, holding wand) -->
  <rect x="10" y="36" width="8"  height="6"  fill="#6b4fa0"/>
  <rect x="6"  y="30" width="8"  height="8"  fill="#6b4fa0"/>
  <!-- Left hand -->
  <rect x="4"  y="26" width="8"  height="6"  fill="#e8c99a"/>

  <!-- Wand -->
  <rect x="2"  y="6"  width="4"  height="22" fill="#5c3d1e"/>
  <!-- Wand tip glow -->
  <rect x="0"  y="2"  width="8"  height="8"  fill="#ffe066"/>
  <rect x="2"  y="0"  width="4"  height="4"  fill="#fff5a0"/>

  <!-- Sparkles around wand tip -->
  <!-- Star 1 -->
  <rect x="10" y="2"  width="2"  height="6"  fill="#e4694a"/>
  <rect x="8"  y="4"  width="6"  height="2"  fill="#e4694a"/>
  <!-- Star 2 -->
  <rect x="14" y="10" width="2"  height="4"  fill="#ffe066"/>
  <rect x="13" y="11" width="4"  height="2"  fill="#ffe066"/>
  <!-- Star 3 -->
  <rect x="10" y="16" width="2"  height="4"  fill="#7b50d0"/>
  <rect x="9"  y="17" width="4"  height="2"  fill="#7b50d0"/>
  <!-- Star 4 small -->
  <rect x="16" y="4"  width="2"  height="2"  fill="#e4694a"/>
  <rect x="16" y="8"  width="2"  height="2"  fill="#ffe066"/>

  <!-- Right arm (relaxed at side) -->
  <rect x="46" y="36" width="8"  height="8"  fill="#6b4fa0"/>
  <!-- Right hand -->
  <rect x="46" y="44" width="8"  height="6"  fill="#e8c99a"/>

  <!-- Shoes -->
  <rect x="18" y="66" width="12" height="6"  fill="#2a1a0a"/>
  <rect x="34" y="66" width="12" height="6"  fill="#2a1a0a"/>
  <rect x="16" y="68" width="6"  height="4"  fill="#2a1a0a"/>
  <rect x="42" y="68" width="6"  height="4"  fill="#2a1a0a"/>
</svg>
