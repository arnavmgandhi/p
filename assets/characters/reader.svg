<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges" width="256" height="320">
  <!-- Reader character: sitting cross-legged, reading a book -->

  <!-- Shadow -->
  <ellipse cx="32" cy="77" rx="14" ry="3" fill="rgba(0,0,0,0.15)"/>

  <!-- Body / torso -->
  <rect x="20" y="38" width="24" height="18" fill="#c9a87c"/>
  <!-- Shirt detail -->
  <rect x="22" y="40" width="20" height="2" fill="#b8935f"/>
  <rect x="22" y="42" width="20" height="1" fill="#d4b48a"/>

  <!-- Crossed legs -->
  <rect x="14" y="54" width="36" height="8" fill="#8b6f4e"/>
  <rect x="12" y="56" width="6" height="6"  fill="#7a5f3e"/>
  <rect x="46" y="56" width="6" height="6"  fill="#7a5f3e"/>
  <!-- Feet -->
  <rect x="10" y="60" width="8" height="4"  fill="#c9a87c"/>
  <rect x="46" y="60" width="8" height="4"  fill="#c9a87c"/>

  <!-- Neck -->
  <rect x="28" y="32" width="8" height="8"  fill="#c9a87c"/>

  <!-- Head -->
  <rect x="20" y="14" width="24" height="22" fill="#e8c99a"/>
  <!-- Head top rounding -->
  <rect x="22" y="12" width="20" height="4"  fill="#e8c99a"/>
  <rect x="24" y="10" width="16" height="4"  fill="#e8c99a"/>

  <!-- Hair -->
  <rect x="20" y="10" width="24" height="6"  fill="#5c3d1e"/>
  <rect x="18" y="12" width="4"  height="8"  fill="#5c3d1e"/>
  <rect x="42" y="12" width="4"  height="8"  fill="#5c3d1e"/>
  <rect x="22" y="8"  width="20" height="4"  fill="#5c3d1e"/>

  <!-- Eyes (reading, looking down slightly) -->
  <rect x="24" y="22" width="4" height="3"   fill="#2a1a0a"/>
  <rect x="36" y="22" width="4" height="3"   fill="#2a1a0a"/>
  <!-- Eye shine -->
  <rect x="25" y="22" width="1" height="1"   fill="#fff"/>
  <rect x="37" y="22" width="1" height="1"   fill="#fff"/>

  <!-- Eyebrows (furrowed, concentrating) -->
  <rect x="23" y="20" width="6" height="2"   fill="#5c3d1e"/>
  <rect x="35" y="20" width="6" height="2"   fill="#5c3d1e"/>

  <!-- Small smile -->
  <rect x="27" y="30" width="2" height="1"   fill="#a0714a"/>
  <rect x="29" y="31" width="6" height="1"   fill="#a0714a"/>
  <rect x="35" y="30" width="2" height="1"   fill="#a0714a"/>

  <!-- Arms holding book -->
  <rect x="12" y="42" width="8"  height="14" fill="#c9a87c"/>
  <rect x="44" y="42" width="8"  height="14" fill="#c9a87c"/>

  <!-- Hands -->
  <rect x="10" y="52" width="8"  height="6"  fill="#e8c99a"/>
  <rect x="46" y="52" width="8"  height="6"  fill="#e8c99a"/>

  <!-- Book (open, held up) -->
  <rect x="16" y="44" width="32" height="22" fill="#f5f0e8"/>
  <!-- Book spine -->
  <rect x="31" y="44" width="2"  height="22" fill="#d4c9b0"/>
  <!-- Left page lines -->
  <rect x="18" y="48" width="11" height="1"  fill="#c8bfa8"/>
  <rect x="18" y="50" width="11" height="1"  fill="#c8bfa8"/>
  <rect x="18" y="52" width="9"  height="1"  fill="#c8bfa8"/>
  <rect x="18" y="54" width="11" height="1"  fill="#c8bfa8"/>
  <rect x="18" y="56" width="8"  height="1"  fill="#c8bfa8"/>
  <rect x="18" y="58" width="11" height="1"  fill="#c8bfa8"/>
  <rect x="18" y="60" width="10" height="1"  fill="#c8bfa8"/>
  <!-- Right page lines -->
  <rect x="33" y="48" width="11" height="1"  fill="#c8bfa8"/>
  <rect x="33" y="50" width="11" height="1"  fill="#c8bfa8"/>
  <rect x="33" y="52" width="9"  height="1"  fill="#c8bfa8"/>
  <rect x="33" y="54" width="11" height="1"  fill="#c8bfa8"/>
  <rect x="33" y="56" width="7"  height="1"  fill="#c8bfa8"/>
  <rect x="33" y="58" width="11" height="1"  fill="#c8bfa8"/>
  <rect x="33" y="60" width="9"  height="1"  fill="#c8bfa8"/>
  <!-- Book cover border -->
  <rect x="16" y="44" width="32" height="1"  fill="#a08060"/>
  <rect x="16" y="65" width="32" height="1"  fill="#a08060"/>
  <rect x="16" y="44" width="1"  height="22" fill="#a08060"/>
  <rect x="47" y="44" width="1"  height="22" fill="#a08060"/>

  <!-- Glasses -->
  <rect x="22" y="20" width="8"  height="7"  fill="none" stroke="#5c3d1e" stroke-width="1.5"/>
  <rect x="34" y="20" width="8"  height="7"  fill="none" stroke="#5c3d1e" stroke-width="1.5"/>
  <rect x="30" y="23" width="4"  height="1"  fill="#5c3d1e"/>
</svg>
